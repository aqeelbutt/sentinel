[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "sentinel"
version = "0.1.0"
description = "Triple-Check equity recommendation engine with virtual portfolio tracking"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Sentinel" }]

dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "streamlit>=1.36",
    "plotly>=5.22",
    "yfinance>=0.2.40",
    "pandas>=2.2",
    "numpy>=1.26",
    "pandas-market-calendars>=4.4",
    "structlog>=24.1",
    "aiosqlite>=0.20",
    "httpx>=0.27",
    "feedparser>=6.0",
    "keyring>=25.0",
    "python-dotenv>=1.0",
    "anthropic>=0.40",
]

[project.optional-dependencies]
finbert = [
    "transformers>=4.40",
    "torch>=2.2",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-pyyaml",
]

[project.scripts]
sentinel = "sentinel.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/sentinel"]

[tool.hatch.build.targets.sdist]
include = ["src/sentinel", "config", "README.md", "CLAUDE.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
markers = [
    "slow: marks tests that hit network or load FinBERT",
    "integration: end-to-end tests that require a real environment",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
warn_redundant_casts = true
disallow_untyped_defs = true
packages = ["sentinel"]
mypy_path = "src"
